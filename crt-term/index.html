
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/firacode/6.2.0/fira_code.min.css"
    />

    <title>crt-term</title>

    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #121212;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #terminal {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 8px; 
        overflow: hidden;
        outline: none;
      }

      pre {
        font-family: "Fira Code", monospace;
        font-size: 16px;
        margin:0;
      }

      /* Smaller terminal text on phones, without changing desktop. */
      @media (max-width: 600px) {
        #terminal {
          padding: 2px;
        }

        pre {
          font-size: 10px;
          line-height: 1;
        }
      }
      @media (pointer: coarse) {
        #mobile-terminal-input {
          pointer-events: auto;
        }
      }
    </style>
  </head>

  <body>
    <div id="terminal" tabindex="0"></div>

    <input
      id="mobile-terminal-input"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="send"
      aria-label="Terminal command input"
    />

    <script type="module" src="/src/main.rs"></script>

    <script>
      const terminal = document.getElementById("terminal");
      const mobileInput = document.getElementById(
        "mobile-terminal-input"
      );

      const isTouchDevice = window.matchMedia("(pointer: coarse)");

      terminal.addEventListener("pointerdown", () => {
        if (!isTouchDevice.matches) return;

        if (document.activeElement !== mobileInput) {
          mobileInput.focus({ preventScroll: true });
        }
      });
    </script>
  </body>
</html>
