
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/firacode/6.2.0/fira_code.min.css"
    />

    <title>crt-term</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #121212;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #terminal {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        padding: 8px;
        overflow: hidden;
        outline: none;
      }

      pre {
        font-family: "Fira Code", monospace;
        font-size: 16px;
        margin: 0;
      }

      /* compact terminal on phones. */
      @media (max-width: 600px) {
        #terminal {
          padding: 2px;
          font-size: 12px;
        }

        pre {
          font-size: 12px;
        }
      }

      /* only activate the mobile input on touch-oriented devices. */
      #mobile-terminal-input {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0.01;
        z-index: 10;
        pointer-events: none;
      }

      @media (pointer: coarse) {
        #mobile-terminal-input {
          pointer-events: auto;
        }
      }
    </style>
  </head>

  <body>
    <div id="terminal" tabindex="0"></div>

    <input
      id="mobile-terminal-input"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="send"
      aria-label="Terminal command input"
    />

    <script type="module" src="/src/main.rs"></script>

    <script>
      const terminal = document.getElementById("terminal");
      const mobileInput = document.getElementById(
        "mobile-terminal-input"
      );

      const isTouchDevice = window.matchMedia(
        "(pointer: coarse)"
      );

      // on phones, tapping the terminal opens the virtual keyboard.
      terminal.addEventListener("pointerdown", (event) => {
        if (!isTouchDevice.matches) return;

        // Don't steal input from selectable text or other controls.
        mobileInput.focus({ preventScroll: true });
      });

      // forwards virtual keyboard input to the keyboard events that the existing Ratzilla handler receives.
      function sendKey(key, code) {
        window.dispatchEvent(
          new KeyboardEvent("keydown", {
            key,
            code,
            bubbles: true,
            cancelable: true,
          })
        );
      }

      mobileInput.addEventListener("input", () => {
        if (!isTouchDevice.matches) return;

        const text = mobileInput.value;
        mobileInput.value = "";

        // forward typed characters one at a time.
        for (const char of text) {
          sendKey(char, "");
        }
      });

      mobileInput.addEventListener("keydown", (event) => {
        if (!isTouchDevice.matches) return;

        if (event.key === "Enter") {
          event.preventDefault();
          sendKey("Enter", "Enter");
        } else if (event.key === "Backspace") {
          event.preventDefault();
          sendKey("Backspace", "Backspace");
        }
      });
    </script>
  </body>
</html>
